name: GitHub Space Shooter

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: GitHub Space Shooter
        uses: czl9707/gh-space-shooter@v2.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
